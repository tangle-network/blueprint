name: Recover tagged library crates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - name: Disable Hakari
        run: |
          cargo hakari disable
          cargo hakari remove-deps -y
      - uses: ./.github/actions/free-disk-space
      - name: Validate exact tagged library plan
        run: |
          python3 .github/scripts/crate-publish-plan.py .github/release-manifests/36556002501-libraries.json --verify-tags --check-external
      - name: Publish missing exact versions
        run: |
          .github/scripts/batch-publish.sh .github/release-manifests/36556002501-libraries.json --verify-tags
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Verify complete library release
        if: always() && !cancelled()
        run: python3 .github/scripts/verify_release_tags.py .github/release-manifests/36556002501-libraries.json
