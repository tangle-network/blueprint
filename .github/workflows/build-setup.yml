# Build prerequisites for cargo-dist's cargo-tangle artifact jobs.

- name: install protobuf and gmp (Linux)
  if: runner.os == 'Linux'
  run: |
    sudo apt-get update
    sudo apt-get install -y protobuf-compiler libprotobuf-dev libgmp-dev

- name: install protobuf and gmp (macOS)
  if: runner.os == 'macOS'
  run: |
    brew install protobuf gmp
    echo "Installed protobuf and gmp on macOS"

- name: Install LLVM and Clang
  uses: KyleMayes/install-llvm-action@v2
  with:
    version: "19.1.7"

- name: Build cloud-only CLI artifact
  if: runner.os == 'Linux'
  env:
    CLOUD_TARGET: ${{ matrix.targets[0] }}
  run: python3 .github/scripts/cloud_artifact.py build "$CLOUD_TARGET"

- name: Upload cloud-only artifact to cargo-dist
  if: runner.os == 'Linux'
  uses: actions/upload-artifact@v4
  with:
    name: artifacts-cloud-${{ matrix.targets[0] }}
    path: target/cloud-artifacts/cargo-tangle-cloud-*
