name: Release
run-name: cargo-tangle artifacts ${{ inputs.tag || github.ref_name }}
permissions:
  "contents": "write"

on:
  push:
    tags:
      - 'cargo-tangle-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing cargo-tangle version tag to build or recover
        required: true
        type: string

concurrency:
  group: cargo-tangle-artifacts-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ inputs.tag || github.ref_name }}
      tag-flag: ${{ format('--tag={0}', inputs.tag || github.ref_name) }}
      complete: ${{ steps.complete.outputs.complete }}
      source-sha: ${{ steps.plan.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Use this workflow revision's release tooling
        run: git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_WORKFLOW_SHA" && git checkout FETCH_HEAD -- dist-workspace.toml .github/scripts/verify_release_tags.py
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/astral-sh/cargo-dist/releases/download/v0.28.7-prerelease.1/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
          retention-days: 1
      - id: plan
        run: |
          dist plan --tag="$RELEASE_TAG" --output-format=json > plan-dist-manifest.json
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Check existing source-bound artifacts
        id: complete
        run: |
          if python3 .github/scripts/verify_release_tags.py --artifacts check --plan plan-dist-manifest.json --tag "$RELEASE_TAG"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 3 ]; then exit "$status"; fi
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ needs.plan.outputs.complete == 'false' && fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          ref: refs/tags/${{ needs.plan.outputs.tag }}
      - name: Use the planned source and this workflow revision's release tooling
        run: test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.source-sha }}" && git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_WORKFLOW_SHA" && git checkout FETCH_HEAD -- dist-workspace.toml .github/scripts/verify_release_tags.py
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: "install protobuf and gmp (Linux)"
        if: "runner.os == 'Linux'"
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libgmp-dev
      - name: "install protobuf and gmp (macOS)"
        if: "runner.os == 'macOS'"
        run: |
          brew install protobuf gmp
          echo "Installed protobuf and gmp on macOS"
      - name: "Install LLVM and Clang"
        uses: "KyleMayes/install-llvm-action@v2"
        with:
          "version": "19.1.7"
      - name: Build cloud-only CLI artifact
        if: runner.os == 'Linux'
        env:
          CLOUD_TARGET: ${{ matrix.targets[0] }}
        run: python3 .github/scripts/cloud_artifact.py build "$CLOUD_TARGET"
      - name: Upload cloud-only artifact to cargo-dist
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-cloud-${{ matrix.targets[0] }}
          path: target/cloud-artifacts/cargo-tangle-cloud-*
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          upload_paths=$(dist print-upload-files-from-manifest --manifest dist-manifest.json)
          printf 'paths<<EOF\n%s\nEOF\n' "$upload_paths" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    if: needs.plan.outputs.complete == 'false'
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          ref: refs/tags/${{ needs.plan.outputs.tag }}
      - name: Use the planned source and this workflow revision's release tooling
        run: test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.source-sha }}" && git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_WORKFLOW_SHA" && git checkout FETCH_HEAD -- dist-workspace.toml .github/scripts/verify_release_tags.py
      - name: Install cached dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json

          upload_paths=$(jq --raw-output ".upload_files[]" dist-manifest.json)
          printf 'paths<<EOF\n%s\nEOF\n' "$upload_paths" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.complete == 'false' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          ref: refs/tags/${{ needs.plan.outputs.tag }}
      - name: Use the planned source and this workflow revision's release tooling
        run: test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.source-sha }}" && git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_WORKFLOW_SHA" && git checkout FETCH_HEAD -- dist-workspace.toml .github/scripts/verify_release_tags.py
      - name: Install cached dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          python3 .github/scripts/verify_release_tags.py --artifacts record --plan target/distrib/plan-dist-manifest.json --tag "$RELEASE_TAG"
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          RELEASE_COMMIT: "${{ needs.plan.outputs.source-sha }}"
        run: |
          gh release upload "$RELEASE_TAG" target/distrib/release-source.json --clobber
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

          prerelease_args=()
          if [ -n "$PRERELEASE_FLAG" ]; then
            prerelease_args+=("$PRERELEASE_FLAG")
          fi
          gh release edit "$RELEASE_TAG" --target "$RELEASE_COMMIT" "${prerelease_args[@]}" --draft=false
          python3 .github/scripts/verify_release_tags.py --artifacts check --plan target/distrib/plan-dist-manifest.json --tag "$RELEASE_TAG"
          echo "source-bound artifacts uploaded and verified"
