name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Publish all crates to crates.io
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      - name: Disable Hakari
        run: |
          cargo hakari disable
          cargo hakari remove-deps -y

      - uses: ./.github/actions/free-disk-space

      - name: Build release JSON from workspace metadata
        run: |
          cargo metadata --format-version 1 --no-deps | python3 -c "
          import json, sys
          meta = json.load(sys.stdin)
          skip = {'workspace-hack', 'hello-tangle-blueprint', 
                  'incredible-squaring-blueprint-bin', 'incredible-squaring-blueprint-lib',
                  'apikey-blueprint-bin', 'apikey-blueprint-lib',
                  'oauth-blueprint-bin', 'oauth-blueprint-lib', 'x402-blueprint'}
          releases = []
          for pkg in meta['packages']:
              if any(pkg['name'] in m for m in meta.get('workspace_members', [])):
                  if pkg['name'] not in skip:
                      releases.append({'package_name': pkg['name']})
          json.dump(releases, open('release-output.json', 'w'), indent=2)
          print(f'Generated release-output.json with {len(releases)} packages')
          "
          cat release-output.json

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        run: |
          bash .github/scripts/batch-publish.sh release-output.json
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: |
          # Report the publish plan: which crates a real run would publish and
          # which it would skip. `batch-publish.sh` checks the sparse index per
          # crate and skips any version already live, so an already-published
          # version is NOT a failure — release-plz bumps only what changed while
          # this workflow enumerates every publishable workspace member, so a
          # partial overlap is the normal case. A full `cargo publish --dry-run`
          # per crate is NOT usable here: dry-run still resolves dependencies
          # from the registry, so every crate depending on a sibling published in
          # this same batch would fail spuriously.
          python3 - <<'PY'
          import json, urllib.request, subprocess, sys

          UA = {"User-Agent": "tangle-blueprint-release (hello@tangle.tools)"}
          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--format-version", "1", "--no-deps"], text=True))
          version = {p["name"]: p["version"] for p in meta["packages"]}
          names = [r["package_name"] for r in json.load(open("release-output.json"))]

          print(f"DRY RUN — would publish {len(names)} crate(s):")
          collisions = []
          for n in names:
              v = version.get(n, "?")
              try:
                  req = urllib.request.Request(
                      f"https://crates.io/api/v1/crates/{n}", headers=UA)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      published = {x["num"] for x in json.load(r).get("versions", [])}
              except Exception as e:            # unpublished crate / transient
                  published = set()
                  print(f"  {n} {v}  (registry lookup skipped: {e})")
                  continue
              if v in published:
                  collisions.append((n, v))
                  print(f"  {n} {v}  ALREADY PUBLISHED")
              else:
                  print(f"  {n} {v}  ok")

          print()
          if collisions:
              print(f"{len(collisions)} crate(s) are already at their target version and "
                    "will be SKIPPED by batch-publish.sh (it checks the sparse index "
                    "before publishing each crate). This is normal: release-plz only "
                    "bumps crates that changed, while this workflow enumerates every "
                    "publishable workspace member.")
              for n, v in collisions:
                  print(f"  skip: {n} {v}")
              print()
          print(f"A real run would publish {len(names) - len(collisions)} crate(s) and "
                f"skip {len(collisions)}.")
          PY
