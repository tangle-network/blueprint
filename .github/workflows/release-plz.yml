name: Release Plz

permissions:
  pull-requests: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      recover-tagged:
        description: Publish versions whose tags exist but are not on crates.io; creates no new releases
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - dist-workspace.toml
      - .github/**

# Release runs race on tag creation (#1630) and the registry, so they serialize; queue: max keeps every pending run, where the default lets a push replace a pending recover-tagged dispatch.
concurrency:
  group: release-plz
  queue: max

env:
  RELEASE_PLZ_LOG: TRACE

jobs:
  check-release-enabled:
    name: Check if releases are enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release-plz.toml
        id: check
        run: |
          if git log -1 --format=%s | grep -Fq "[skip release-plz]"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Explicit release recovery hold in merge subject"
          elif grep -q "^release = false" release-plz.toml 2>/dev/null; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Releases disabled in release-plz.toml"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Releases enabled"
          fi

  release-plz:
    name: Release-plz
    permissions:
      actions: write
      contents: read
    needs: check-release-enabled
    if: needs.check-release-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # Bound a stalled publish run while leaving room for registry rate limits; batch-publish.sh paces every crate, and a whole-workspace release publishes all of them.
    timeout-minutes: 180
    steps:
      # Generating a GitHub token, so that PRs and tags created by
      # the release-plz-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v1
        id: generate-token
        with:
          app-id: ${{ secrets.WEBB_SPIDER_APP_ID }}
          private-key: ${{ secrets.WEBB_SPIDER_PRIV_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - name: Checkout the newest release commit (recovery)
        if: inputs.recover-tagged == true
        run: git checkout --detach "$(git for-each-ref --sort=-creatordate --format='%(objectname)' refs/tags | head -1)"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      - name: Disable Hakari
        run: |
          cargo hakari disable
          cargo hakari remove-deps -y

      - name: Install build prerequisites for the semver-check builds
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev libgmp-dev

      - uses: ./.github/actions/free-disk-space
      - name: Run release-plz (creates tags & releases, but doesn't publish)
        if: inputs.recover-tagged != true
        id: release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback # cargo-semver-checks resolves a fresh lockfile; keep dependencies the pinned rustc can build (alloy 2.5.0 needs 1.94.1)
          CXXFLAGS: -include cstdint # librocksdb-sys 0.11 (RocksDB 8.1.1) does not compile on GCC 13 without it, as in examples/incredible-squaring/.cargo/config.toml

      - name: Recover release output from existing tags
        if: inputs.recover-tagged == true
        run: git checkout "$GITHUB_SHA" -- .github/scripts && python3 .github/scripts/crate-publish-plan.py --from-tags > release-output.json

      - name: Save release output for batch publishing
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES_JSON: ${{ steps.release-plz.outputs.releases }}
        run: printf '%s\n' "$RELEASES_JSON" > release-output.json

      - name: Batch publish to crates.io (with rate limiting)
        if: steps.release-plz.outputs.releases_created == 'true' || inputs.recover-tagged == true
        run: |
          ./.github/scripts/batch-publish.sh release-output.json
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify every released crate is on crates.io
        if: always() && !cancelled() && (steps.release-plz.outputs.releases_created == 'true' || inputs.recover-tagged == true)
        run: python3 .github/scripts/verify_release_tags.py release-output.json

      - name: Dispatch CLI artifacts and record the run
        if: success() && (steps.release-plz.outputs.releases_created == 'true' || inputs.recover-tagged == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_release_tags.py --artifacts dispatch release-output.json
