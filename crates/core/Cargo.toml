[package]
name = "blueprint-core"
version = "0.2.0-alpha.6"
description = "Blueprint SDK Core functionality"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes.workspace = true
futures-util.workspace = true
pin-project-lite.workspace = true
tower = { workspace = true, features = ["util"] }
hashbrown = { workspace = true, default-features = false, features = ["default-hasher", "inline-more"] }
tiny-keccak = { workspace = true, features = ["keccak"] }
tracing = { workspace = true }
serde = { workspace = true, features = ["alloc", "derive"] }
serde_json = { workspace = true, features = ["alloc"] }

schemars = { version = "1.2.1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# Path-only test dependency avoids a publish-time cycle through the SDK.
blueprint-sdk = { path = "../sdk", features = ["std"] }
serde_json = { workspace = true, features = ["alloc"] }
tower = { workspace = true, features = ["util", "timeout", "limit", "load-shed", "steer", "filter"] }
tokio = { workspace = true, features = ["full"] }

[features]
default = ["std", "tracing"]
std = ["futures-util/std"]
tracing = []
schema = ["dep:schemars"]

[lints]
workspace = true
